<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Demian Nezhdanov | Mobile & Graphics Engineer</title>
	<meta name="description" content="Demian Nezhdanov is a mobile and graphics engineer focused on real-time systems, performant rendering, and interactive visual experiences.">
	<meta name="theme-color" content="#080b12">
	<style>
		:root {
			color-scheme: dark;
			--text: #ecf6ff;
			--muted: #bed5ef;
			--glass: rgba(6, 9, 17, 0.48);
			--stroke: rgba(255, 255, 255, 0.2);
		}

		* {
			box-sizing: border-box;
		}

		html,
		body {
			width: 100%;
			height: 100%;
			margin: 0;
		}

		body {
			position: relative;
			overflow: hidden;
			font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
			background: #080b12;
			color: var(--text);
		}

		.webgl-canvas {
			position: fixed;
			inset: 0;
			width: 100%;
			height: 100%;
			display: block;
			z-index: 0;
		}

		.page-content {
			position: relative;
			z-index: 2;
			min-height: 100%;
			padding: clamp(20px, 4vw, 44px);
			display: grid;
			align-content: center;
			justify-items: center;
			pointer-events: none;
		}

		.hero {
			width: fit-content;
		}

		.social {
			position: static;
			display: flex;
			gap: 10px;
			padding: 8px;
			border: 1px solid var(--stroke);
			border-radius: 999px;
			background: rgba(4, 8, 16, 0.66);
			backdrop-filter: blur(8px);
		}

		.social a {
			width: 34px;
			height: 34px;
			border-radius: 999px;
			display: inline-flex;
			align-items: center;
			justify-content: center;
			color: #f8fbff;
			text-decoration: none;
			background: rgba(255, 255, 255, 0.08);
			border: 1px solid rgba(255, 255, 255, 0.24);
			transition: transform 160ms ease, background-color 160ms ease;
			pointer-events: auto;
		}

		.social a:hover,
		.social a:focus-visible {
			transform: translateY(-1px);
			background: rgba(255, 255, 255, 0.2);
			outline: none;
		}

		.social svg {
			width: 15px;
			height: 15px;
			fill: currentColor;
		}

		.sr-only {
			position: absolute;
			width: 1px;
			height: 1px;
			padding: 0;
			margin: -1px;
			overflow: hidden;
			clip: rect(0, 0, 0, 0);
			border: 0;
		}

		@media (max-width: 560px) {
			.page-content {
				padding-top: clamp(20px, 4vw, 44px);
				align-content: center;
			}
		}
	</style>
</head>
